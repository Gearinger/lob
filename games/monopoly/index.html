<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大富翁 Online — Lob</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0a0a0a;--card:rgba(12,12,18,0.9);--border:rgba(255,255,255,0.06);--accent:#67e8f9;--text:#E8E8F0;--dim:rgba(232,232,240,0.5);}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;}

/* Header */
#header{display:flex;align-items:center;gap:16px;margin-bottom:12px;width:100%;max-width:960px;}
#header h1{font-size:1.4rem;font-weight:700;color:var(--accent);letter-spacing:-0.02em;}
#turn-indicator{font-size:0.85rem;color:var(--dim);background:var(--card);padding:6px 14px;border-radius:20px;border:1px solid var(--border);}

/* Main Layout */
#main{display:flex;gap:16px;width:100%;max-width:960px;}

/* Board */
#board-wrap{position:relative;flex-shrink:0;touch-action:pan-x pan-y;}
#board{position:relative;width:704px;height:704px;background:var(--card);border:1px solid var(--border);border-radius:12px;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.015) 0px,rgba(255,255,255,0.015) 1px,transparent 1px,transparent 64px),repeating-linear-gradient(90deg,rgba(255,255,255,0.015) 0px,rgba(255,255,255,0.015) 1px,transparent 1px,transparent 64px);touch-action:none;}

/* Cells */
.cell{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.6rem;cursor:pointer;transition:all 0.2s;border-radius:4px;overflow:hidden;padding:2px;}
.cell:hover{filter:brightness(1.2);}
.cell.side-cell{width:64px;height:64px;}
/* Corner cells */
.cell.corner{width:64px;height:64px;background:rgba(103,232,249,0.08);border:1px solid rgba(103,232,249,0.2);}
.cell .city{font-weight:600;font-size:0.58rem;text-align:center;line-height:1.2;letter-spacing:-0.01em;}
.cell .price{font-size:0.52rem;color:var(--dim);margin-top:1px;}
.cell .color-bar{position:absolute;bottom:0;left:0;right:0;height:4px;}
.cell .cell-num{position:absolute;top:2px;left:3px;font-size:0.45rem;color:rgba(255,255,255,0.3);}
.cell .owner-dot{position:absolute;top:2px;right:3px;width:10px;height:10px;border-radius:50%;}
.cell.highlight{border:2px solid var(--accent)!important;box-shadow:0 0 12px rgba(103,232,249,0.5),0 0 24px rgba(103,232,249,0.2)!important;z-index:10;animation:cellPulse 1.5s infinite}
.cell.highlight.owned{border-color:#ffe66d!important;box-shadow:0 0 12px rgba(255,230,109,0.5)!important;}
.cell.purchased{animation:purchaseFlash 0.8s ease-out}

/* Dice Area */
#dice-center{position:absolute;left:288px;top:256px;background:radial-gradient(ellipse at center,rgba(103,232,249,0.03) 0%,transparent 70%);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px;}
#dice-btn{width:96px;height:96px;background:var(--card);border:2px solid var(--accent);border-radius:16px;cursor:pointer;font-size:1rem;font-weight:700;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s;user-select:none;}
#dice-btn:hover{background:rgba(103,232,249,0.1);transform:scale(1.05);}
#dice-btn:active{transform:scale(0.97);}
#dice-display{display:flex;gap:12px;}
.die{width:36px;height:36px;background:#1a1a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:var(--accent);border:1px solid rgba(103,232,249,0.2);}
.die.rolling{animation:shake 0.15s infinite;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}60%{transform:translateY(-3px)}}
@keyframes goldPop{0%{transform:scale(1)}50%{transform:scale(1.3);color:#ffe66d}100%{transform:scale(1)}}
@keyframes cardFlip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes cellPulse{0%,100%{box-shadow:0 0 0 0 rgba(103,232,249,0)}50%{box-shadow:0 0 20px 4px rgba(103,232,249,0.4)}}
@keyframes purchaseFlash{0%{background:rgba(103,232,249,0.3)}100%{background:transparent}}
@keyframes tokenLand{0%{transform:scale(1.4);opacity:0.7}100%{transform:scale(1);opacity:1}}
@keyframes rentShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

/* Bot thinking indicator */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.bot-thinking{animation:pulse 1s infinite;color:#ffe66d;font-size:0.75rem;margin-top:4px}
.bot-indicator{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#ffe66d;color:#000;font-size:0.55rem;padding:1px 4px;border-radius:4px;font-weight:700;opacity:0;transition:opacity 0.3s}
.bot-indicator.active{opacity:1;animation:pulse 0.8s infinite}

/* Player Tokens on Board */
.token{position:absolute;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:20;transition:left 0.25s ease,top 0.25s ease;border:2px solid rgba(255,255,255,0.6);box-shadow:0 2px 6px rgba(0,0,0,0.5);}
.token.landing{animation:tokenLand 0.3s ease-out, bounce 0.6s ease-out}
.token.p0{background:#67e8f9;color:#000;}
.token.p1{background:#ff6b6b;}
.token.p2{background:#ffe66d;color:#000;}
.token.p3{background:#a78bfa;}

/* Right Panel */
#panel{width:240px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;}
@media (max-width: 768px) {
  #panel{width:100%;max-width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;}
  .player-card{min-width:140px;flex:1 1 45%;}
}
.player-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:0.78rem;}
.player-card.active{border-color:var(--accent);box-shadow:0 0 12px rgba(103,232,249,0.15);}
.player-card .pname{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.player-card .pstat{color:var(--dim);margin-top:2px;font-size:0.72rem;}
.player-card .pgold{color:var(--accent);font-weight:700;font-size:0.85rem;}
.player-card .pgold.gain{animation:goldPop 0.5s ease-out;color:#4ade80!important}
.player-card .pgold.loss{animation:rentShake 0.4s ease;color:#f87171!important}

/* Game Log */
#log-panel{width:100%;max-width:960px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;max-height:160px;overflow-y:auto;font-size:0.75rem;color:var(--dim);}
#log-panel .log-entry{margin-bottom:3px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
/* Tooltip */
#tooltip{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:0.75rem;color:var(--text);pointer-events:none;z-index:50;display:none;min-width:120px;}
#tooltip .t-city{font-weight:700;color:var(--accent);}
#tooltip .t-rank{color:var(--dim);margin-top:2px;}
#tooltip .t-rent{color:#4ade80;margin-top:1px;}
#tooltip .t-owner{color:#ffe66d;margin-top:1px;}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;min-width:280px;max-width:90vw;width:320px;}
@media (max-width: 480px) {
  .modal{padding:16px;min-width:90vw;border-radius:12px;}
  .modal h2{font-size:1rem;margin-bottom:12px;}
  .modal-info{font-size:0.8rem;}
}
.modal h2{font-size:1.1rem;margin-bottom:16px;color:var(--accent);}
.modal-info{margin-bottom:12px;font-size:0.85rem;color:var(--dim);}
.modal-info strong{color:var(--text);}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.btn{background:rgba(103,232,249,0.1);border:1px solid var(--accent);color:var(--accent);padding:12px 24px;border-radius:8px;cursor:pointer;font-size:0.9rem;font-weight:600;transition:all 0.15s;min-height:44px;touch-action:manipulation;}
.btn:hover{background:rgba(103,232,249,0.2);}
.btn:active{transform:scale(0.97);}
.btn.secondary{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);color:var(--dim);}
.btn.danger{background:rgba(220,38,38,0.15);border-color:#dc2626;color:#f87171;}

@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.modal{animation:slideIn 0.2s ease;}

/* Game Over */
#gameover{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:200;}
#gameover.show{display:flex;}
#gameover .modal{max-width:420px;text-align:center;}
#gameover h2{font-size:1.5rem;color:var(--accent);}
#gameover .winner{font-size:1.1rem;margin:12px 0;color:#ffe66d;}
#gameover .stats{margin:16px 0;font-size:0.85rem;color:var(--dim);}

/* Responsive */
@media (max-width: 960px) {
  #main{flex-direction:column;align-items:center;overflow-x:auto;}
  #panel{width:100%;max-width:704px;}
}
@media (max-width: 768px) {
  body{padding:8px;}
  #header{flex-direction:column;gap:8px;text-align:center;}
  #header h1{font-size:1.3rem;margin:0;}
  #turn-indicator{font-size:0.9rem;}
  #main{gap:12px;}
}
@media (max-width: 704px) {
  #board-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #board{transform-origin:top left;}
  #panel{font-size:0.85rem;}
  .player-card{padding:8px;}
  .cell{font-size:0.5rem;}
  .cell .city{font-size:0.45rem;}
  #dice-btn{width:72px;height:72px;font-size:0.9rem;}
  .die{width:28px;height:28px;font-size:1rem;}
}
</style>
</head>
<body>

<div id="header">
  <h1>🎲 大富翁 Online</h1>
  <div id="turn-indicator">等待开始...</div>
</div>

<div id="main">
  <div id="board-wrap">
    <div id="board">
      <!-- Cells injected by JS -->
    </div>
    <div id="dice-center">
      <!-- Decorative compass rose -->
      <div id="board-deco" style="position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;">

          <circle cx="144" cy="128" r="100" fill="none" stroke="rgba(103,232,249,0.06)" stroke-width="1"/>

          <circle cx="144" cy="128" r="40" fill="rgba(103,232,249,0.02)" stroke="rgba(103,232,249,0.08)" stroke-width="1"/>

          <line x1="144" y1="28" x2="144" y2="228" stroke="rgba(103,232,249,0.06)" stroke-width="1"/>

        </svg>
      </div>

</div>

<div id="tooltip"></div>

<div id="log-panel"></div>

<!-- Buy Modal -->
<div class="modal-overlay" id="buy-modal">
  <div class="modal">
    <h2>🏠 购买地皮</h2>
    <div class="modal-info" id="buy-info"></div>

</div>

<!-- Rent Modal -->
<div class="modal-overlay" id="rent-modal">

    <div class="modal-btns">
      <button class="btn" onclick="closeRent()">确定</button>
    </div>
  </div>
</div>

<!-- Card Modal -->
<div class="modal-overlay" id="card-modal">
  <div class="modal">
    <h2 id="card-title">🎲 机会卡</h2>

    <div class="modal-btns">
      <button class="btn" onclick="closeCardModal()">确定</button>

  </div>
</div>

<!-- Build Modal -->
<div class="modal-overlay" id="build-modal">
  <div class="modal">
    <h2 id="build-title">🏗️ 建造升级</h2>
    <div class="modal-info" id="build-info"></div>
    <div class="modal-btns" id="build-btns"></div>
  </div>
</div>

<!-- Jail Modal -->
<div class="modal-overlay" id="jail-modal">

</div>

    <h2>🎮 大富翁 Online</h2>

    <div class="modal-btns" id="start-btns">
      <button class="btn" onclick="startGame()">开始游戏</button>
    </div>
  </div>
</div>

<!-- Game Over -->
<div id="gameover">
  <div class="modal">

    <div class="stats" id="final-stats"></div>
    <div class="modal-btns">
      <button class="btn" onclick="resetGame()">再来一局</button>

<script>
// ============================================================
// GAME DATA
// ============================================================

const RANK_RENTS = {
  S: [1500, 3000, 5000, 9000, 15000],
  A: [1000, 2000, 3500, 6000, 10000],

const RANK_PRICE = { S: 0, A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 };
const RANK_BUILD = { S: 7000, A: 5500, B: 4000, C: 3000, D: 2000, E: 1200, F: 750 };
const LEVEL_NAMES = ['空地', '🏠 房屋', '🏢 楼房', '🏙️ 摩天楼'];
const RANK_MAP = {};
const SIDE_CELL_W = 64;

const COLORS = { players: ['#67e8f9','#ff6b6b','#ffe66d','#a78bfa'] };

const CELL_DATA = [
  {id:0,type:'start',city:'起点',rank:null,price:0,color:''},

// Build rank price lookup
CELL_DATA.forEach(c => { if(c.rank) { if(!RANK_PRICE[c.rank]) RANK_PRICE[c.rank]=c.price; }});

// ============================================================
// CARD DATA
// ============================================================

const chanceCards = [
  {id:'C-01',name:'一路顺风',effect:'获得 ¥500 奖金',action:(p)=>{p.gold+=500;return '一路顺风，获得 ¥500！';}},

// ============================================================

function shuffleDeck(deck) {
  const d = [...deck];
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}

let cardModalResolve = null;

function drawCard(player, type) {
  const deck = type === 'chance' ? gameState.chanceDeck : gameState.fateDeck;
  const allCards = type === 'chance' ? chanceCards : fateCards;

  if (deck.length === 0) {
    gameState[type + 'Deck'] = shuffleDeck([...allCards]);
  }

  const card = gameState[type + 'Deck'].shift();
  gameState[type + 'Deck'].push(card);

  const result = card.action(player);

  const icon = type === 'chance' ? '🎲' : '🃏';
  const color = type === 'chance' ? '#67e8f9' : '#f97316';
  
  // Only show modal for human player
  if (player.id === 0) {
    const cardModal = document.getElementById('card-modal');
    const cardTitle = document.getElementById('card-title');
    const cardContent = document.getElementById('card-content');
    cardTitle.textContent = type === 'chance' ? '🎲 机会卡' : '🃏 命运卡';
    cardTitle.style.color = color;
    cardContent.innerHTML = `
      <div style="text-align:center">
        <div style="font-size:2rem;margin-bottom:12px">${icon}</div>
        <div style="color:${color};font-weight:700;font-size:1.1rem;margin-bottom:8px">${card.id} ${card.name}</div>
        <div style="color:var(--dim);font-size:0.85rem;margin-bottom:16px">${card.effect}</div>
        <div style="color:var(--text);background:rgba(255,255,255,0.05);padding:10px;border-radius:8px;font-size:0.85rem;min-height:40px">${result}</div>
      </div>
    `;
    cardModal.classList.add('show');
  }

  log(`${player.name} 抽取${type==='chance'?'【机会】':'【命运】'}：${card.name} → ${result}`);
  updatePlayerCards();

  // For bots, end turn immediately; for human, modal will trigger endTurn on close
  if (player.id !== 0) {
    endTurnCheckDouble();
  }

  // Decay global effects
  if (gameState.globalRentHalved > 0) {
    gameState.globalRentHalved--;
    if (gameState.globalRentHalved === 0) log('📢 租金管制/经济过热效果结束');
  }
  if (gameState.bonusColor > 0) { gameState.bonusColor--; }
  if (gameState.cityBoost > 0) { gameState.cityBoost--; }
}

function closeCardModal() {
  document.getElementById('card-modal').classList.remove('show');
  // Resume turn flow after card is shown
  setTimeout(() => {
    endTurnCheckDouble();
  }, 100);
}

// Board layout: counterclockwise, cell[0]=bottom-left corner, cell[9]=bottom-right, etc.
// Side cells: 64×56px, corners: 64×56px
// Board: 680×560px, top-left at (0,0)
// Bottom side (cells 0-9): x: 48..568, y=504 (step 64)
// Right side (cells 10-19): x=600, y: 448..88 (step 56, going DOWN)
// Top side (cells 20-29): x: 568..48, y=40 (step 64, going LEFT)
// Left side (cells 30-39): x=0, y: 88..448 (step 56, going DOWN)

// Board: 704×704, cell size 64×64
// 40 unique positions: 11 bottom + 10 right + 10 top + 9 left

const board = document.getElementById('board');
const diceBtn = document.getElementById('dice-btn');

function getCellPos(idx) {
  // 704×704 board: 40 cells with unique positions (no overlap)
  // Distribution: 11 bottom + 10 right + 10 top + 9 left = 40
  const CELL = 64;
  const BOARD = 704;
  // Bottom (0-10): y = 640, x = 0..640
  if(idx <= 10) return {x: idx * CELL, y: BOARD - CELL};
  // Right (11-20): x = 640, y = 640..64
  if(idx <= 20) return {x: BOARD - CELL, y: BOARD - CELL - (idx - 11 + 1) * CELL};
  // Top (21-30): y = 0, x = 640..64
  if(idx <= 30) return {x: BOARD - CELL - (idx - 21 + 1) * CELL, y: 0};
  // Left (31-39): x = 0, y = 64..640
  return {x: 0, y: (idx - 31 + 1) * CELL};
}

// ============================================================
// TURN MANAGEMENT
// ============================================================

function nextTurn() {
  hideBotIndicator();
  // Auto-save on turn change
  if(phase !== 'start') saveGame();
  
  // Check if game over
  const alive = players.filter(p => p.alive);
  if(alive.length <= 1) {
    endGame(alive[0]);
    return;
  }

  do {
    currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
  } while(!players[currentPlayerIdx].alive);

  const p = players[currentPlayerIdx];

  if(p.inJail) {
    p.jailTurns--;
    if(p.jailTurns <= 0) {
      p.inJail = false;
      log(`⛓️ ${p.name} 走出监狱！`);
    } else if(p.id === 0) {
      // Human player in jail - show options
      showJailModal();
      return;
    } else {
      // Bot tries to roll doubles to get out
      log(`⛓️ ${p.name} 还在监狱，还剩${p.jailTurns}回合`);
      setTimeout(nextTurn, 500);
      return;
    }
  }

  phase = 'dice';
  updateTurnIndicator();
  diceBtn.disabled = false;

  if(p.id !== 0) {
    // Bot turn
    diceBtn.disabled = true;
    setTimeout(() => {
      const thinkTime = 600 + Math.random() * 900;
      log(`🤔 ${p.name} 思考中...`);
      showBotIndicator(p.name);
      updateTurnIndicator();
      setTimeout(() => botRollDice(p), thinkTime);
    }, 300);
  }
}

function updateTurnIndicator() {
  const el = document.getElementById('turn-indicator');
  const badge = document.getElementById('turn-badge');
  if(phase === 'gameover') {
    el.textContent = '游戏结束';
    if(badge) badge.textContent = '';
    return;
  }
  const p = players[currentPlayerIdx];
  if(!p) return;
  if(p.id === 0) {
    el.textContent = '🎮 你的回合';
    if(badge) badge.textContent = '🎮 你的回合';
    if(badge) badge.style.color = 'var(--accent)';
  } else {
    el.textContent = `${p.name} 回合...`;
    if(badge) badge.textContent = `${p.name} 回合`;
    if(badge) badge.style.color = 'var(--dim)';
  }
}

// DICE
// ============================================================

function rollDice() {
  if(phase !== 'dice') return;
  const p = players[currentPlayerIdx];
  if(p.id === 0) diceBtn.disabled = true;

  diceValues = [
    Math.floor(Math.random()*6)+1,
    Math.floor(Math.random()*6)+1
  ];

  // Animate
  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');
  die1.classList.add('rolling');
  die2.classList.add('rolling');
  die1.textContent = '?';
  die2.textContent = '?';

  setTimeout(() => {
    die1.classList.remove('rolling');
    die2.classList.remove('rolling');
    die1.style.transform = 'scale(1.2)';
    die2.style.transform = 'scale(1.2)';
    die1.textContent = diceValues[0];
    die2.textContent = diceValues[1];
    setTimeout(() => { die1.style.transform = ''; die2.style.transform = ''; }, 300);
    hideBotIndicator();
    const total = diceValues[0] + diceValues[1];
    const isDouble = diceValues[0] === diceValues[1];
    log(`🎲 ${p.name} 掷出 ${diceValues[0]} + ${diceValues[1]} = ${total}`);
    
    // Handle jail - if in jail and not doubles, go back to jail
    if(p.inJail) {
      if(isDouble) {
        p.inJail = false;
        p.jailTurns = 0;
        log(`🎊 ${p.name} 掷出双骰，释放出狱！`);
        phase = 'moving';
        movePlayer(p, total);
      } else {
        log(`⛓️ ${p.name} 未掷出双骰，继续在监狱等待`);
        phase = 'dice';
        updateTurnIndicator();
        setTimeout(nextTurn, 800);
      }
      return;
    }
    
    phase = 'moving';
    movePlayer(p, total);
  }, 600);
}

function botRollDice(bot) {
  rollDice();
}

// ============================================================
// MOVEMENT
// ============================================================

function movePlayer(player, steps) {
  const oldPos = player.position;
  let currentPos = oldPos;
  let passedStart = false;
  let step = 0;
  const STEP_DELAY = 250; // ms per cell
  
  function animateStep() {
    step++;
    currentPos = (currentPos + 1) % 40;
    
    // Check if passed start
    if(currentPos === 0 && step > 1) passedStart = true;
    
    // Update player position
    player.position = currentPos;
    
    // During animation: only update token position, no highlight changes
    updateTokenPositions();
    
    // Check start bonus (only on pass-through, not starting at 0)
    if(passedStart && player.id === 0) {
      player.gold += 2000;
      log(`🤑 经过起点，获得 ¥2,000（余额 ¥${player.gold.toLocaleString()}）`);
    } else if(passedStart) {
      player.gold += 2000;
    }
    
    if(step < steps) {
      setTimeout(animateStep, STEP_DELAY);
    } else {
      // Done moving — NOW highlight the landing cell
      setTimeout(() => {
        const cellEl = document.getElementById('cell-' + currentPos);
        if(cellEl) {
          cellEl.classList.add('highlight');
          if(cellEl.style.border && cellEl.style.border.includes('owned')) {
            cellEl.classList.add('owned');
          }
        }
        // Token landing bounce
        const token = document.getElementById('token-' + player.id);
        if(token) { token.classList.remove('landing'); void token.offsetWidth; token.classList.add('landing'); setTimeout(() => token.classList.remove('landing'), 900); }
        updatePlayerCards();
        handleCell(player, currentPos);
      }, STEP_DELAY);
    }
  }
  
  if(steps <= 0) {
    handleCell(player, oldPos);
    return;
  }
  
  animateStep();
}

// ============================================================
// HANDLE CELL
// ============================================================

function handleCell(player, cellIdx) {
  const cell = cells[cellIdx];

  // Special cells
  if(cell.type === 'start') {
    log(`🏁 ${player.name} 到达起点`);
    endTurnCheckDouble();
    return;
  }

  if(cell.type === 'chance' || cell.type === 'fate') {
    drawCard(player, cell.type);
    return;
  }

  if(cell.type === 'park') {
    log(`🌤️ ${player.name} 到达免费停车`);
    endTurnCheckDouble();
    return;
  }

  if(cell.type === 'jail') {
    log(`⛓️ ${player.name} 路过监狱`);
    endTurnCheckDouble();
    return;
  }

  if(cell.type === 'station') {
    if(cell.owner === null) {
      if(player.id === 0) {
        showBuyDialog(cellIdx);
      } else {
        botBuyProperty(player, cell);
      }
    } else if(cell.owner !== player.id) {
      // Station rent scales with number of stations owned: 200×dic × stations owned
      const stationCount = cells.filter(c => c.type === 'station' && c.owner === cell.owner).length;
      const fare = 200 * (diceValues[0] + diceValues[1]) * stationCount;
      payRent(player, cell.owner, fare, `火车站过路费（×${stationCount}）`);
    } else {
      endTurnCheckDouble();
    }
    return;
  }

  if(cell.type === 'airport') {
    if(cell.owner === null) {
      if(player.id === 0) {
        showBuyDialog(cellIdx);
      } else {
        botBuyProperty(player, cell);
      }
    } else if(cell.owner !== player.id) {
      // Airport rent: fixed 500
      const fare = 500;
      payRent(player, cell.owner, fare, '机场过路费');
    } else {
      log(`🏢 ${player.name} 到达自己的机场`);
      endTurnCheckDouble();
    }
    return;
  }

  if(cell.type === 'land') {
    if(cell.owner === null) {
      if(player.id === 0) {
        showBuyDialog(cellIdx);
      } else {
        botBuyProperty(player, cell);
      }
    } else if(cell.owner !== player.id) {
      const rent = getRent(cell);
      payRent(player, cell.owner, rent, `${cell.city}租金`);
    } else {
      log(`🏠 ${player.name} 到达自己的地：${cell.city}`);
      endTurnCheckDouble();
    }
    return;
  }
}

function hasColorSet(player, rank) {
  const colors = {S:['#dc2626'], A:['#ea580c'], B:['#ca8a04'], C:['#16a34a'], D:['#2563eb'], E:['#7c3aed'], F:['#db2777']};
  const c = colors[rank];
  if(!c) return false;
  const owned = cells.filter(cell => cell.rank === rank && cell.owner === player.id);
  return owned.length === c.length;
}

function getRent(cell) {
  if(!cell.rank) return 0;
  const rents = RANK_RENTS[cell.rank];
  const lvl = Math.min(cell.level, 4);
  let rent = rents[lvl];
  // Color set bonus: 2x rent if owner has all same-color properties
  if(hasColorSet(players[cell.owner], cell.rank)) {
    rent *= 2;
  }
  return rent;
}

function payRent(player, ownerIdx, amount, reason) {
  if(player.gold < amount) {
    amount = player.gold; // pay all they have
    log(`💸 ${player.name} 支付 ${reason} ¥${amount.toLocaleString()}（付不起全部）给 ${players[ownerIdx].name}`);
    players[ownerIdx].gold += amount;
    player.gold = 0;
  } else {
    log(`💸 ${player.name} 支付 ${reason} ¥${amount.toLocaleString()} 给 ${players[ownerIdx].name}`);
    player.gold -= amount;
    players[ownerIdx].gold += amount;
  }
  updatePlayerCards();
  // Animate gold changes
  setTimeout(() => {
    const cards = document.querySelectorAll('.player-card');
    const pc = cards[player.id];
    const oc = cards[ownerIdx];
    if(pc) { const el = pc.querySelector('.pgold'); if(el) { el.classList.add('loss'); setTimeout(() => el.classList.remove('loss'), 600); }}
    if(oc) { const el = oc.querySelector('.pgold'); if(el) { el.classList.add('gain'); setTimeout(() => el.classList.remove('gain'), 600); }}
  }, 50);
  closeRent();

  // Check bankruptcy
  if(player.gold <= 0 && player.id === 0) {
    // Player goes bankrupt
    log(`💀 ${player.name} 破产！`);
    player.alive = false;
    setTimeout(endGame(players.filter(p=>p.alive)[0]), 1000);
    return;
  }
  endTurnCheckDouble();
}

function endTurnCheckDouble() {
  // Only check double if it was a double roll
  const isDouble = diceValues[0] === diceValues[1];
  if(isDouble) {
    doubleCount++;
    if(doubleCount >= 3) {
      doubleCount = 0;
      const p = players[currentPlayerIdx];
      p.inJail = true;
      p.jailTurns = 3;
      p.position = 30; // jail
      updateTokenPositions();
      log(`⛓️ ${p.name} 连续3次双骰，进入监狱！`);
      setTimeout(nextTurn, 800);
      return;
    }
    log(`🔄 ${players[currentPlayerIdx].name} 掷出双骰，再来一次！`);
    phase = 'dice';
    updateTurnIndicator();
    if(players[currentPlayerIdx].id === 0) {
      diceBtn.disabled = false;
    } else {
      setTimeout(() => botRollDice(players[currentPlayerIdx]), 800);
    }
  } else {
    doubleCount = 0;
    setTimeout(nextTurn, 300);
  }
}

// Bot personalities: build willingness (0-3), buy threshold multiplier, risk appetite
const BOT_PROFILES = {
  eagle:  { name:'🦅鹰Bot', emoji:'🦅', buildWilling: 3, buyThreshold: 1.2, riskAppetite: 3, color:'#fbbf24', textColor:'#000' },
  turtle: { name:'🐢龟Bot', emoji:'🐢', buildWilling: 1, buyThreshold: 1.0, riskAppetite: 1, color:'#34d399', textColor:'#000' },
  fox:    { name:'🦊狐Bot', emoji:'🦊', buildWilling: 2, buyThreshold: 1.0, riskAppetite: 2, color:'#f97316', textColor:'#000' },
};

function botThinkAndAct(bot) {
  // Phase 1: buy properties (already called via handleCell)
  // Phase 2: consider building upgrades
  botBuildUpgrades(bot);
}

function botBuildUpgrades(bot) {
  const profile = BOT_PROFILES[bot.type];
  if (!profile) return;

  // Find all properties this bot owns
  const owned = cells.filter(c => c.owner === bot.id && c.type === 'property' && c.level < 3);
  if (owned.length === 0) return;

  // Try to build on each property the bot can afford
  // Sort by rank value (higher rank = more valuable = build first)
  owned.sort((a, b) => b.rank - a.rank);

  for (const cell of owned) {
    const buildCost = RANK_BUILD[cell.rank];
    if (bot.gold < buildCost) break;

    // Check if can build (need all same-color properties)
    const rankCells = cells.filter(c => c.rank === cell.rank);
    const allOwned = rankCells.every(c => c.owner === bot.id);
    if (!allOwned) continue;

    // Risk appetite: how many levels to build
    const maxLevel = Math.min(cell.level + profile.buildWilling, 3);
    let targetLevel = cell.level + 1;
    while (targetLevel <= maxLevel) {
      const cost = buildCost; // flat cost per level
      if (bot.gold < cost) break;
      bot.gold -= cost;
      cell.level = targetLevel;
      log(`🏗️ ${bot.name} 在 ${cell.city} 建造了 ${LEVEL_NAMES[cell.level]}（花费 ¥${cost.toLocaleString()}）`);
      updateCellBuilding(cell.id);
      targetLevel++;
    }
  }

  if (bot.gold < 0) bot.gold = 0;
  updatePlayerCards();
}

function botBuyProperty(bot, cell) {
  const profile = BOT_PROFILES[bot.type];
  const threshold = profile ? cell.price * profile.buyThreshold : cell.price;

  if (bot.gold >= threshold) {
    bot.gold -= cell.price;
    cell.owner = bot.id;
    bot.properties.push(cell.index);
    log(`🏠 ${bot.name} 购买 ${cell.city}`);
    updateCellDot(cell.index);
    // Bot immediately considers building on this new property
    botBuildUpgrades(bot);
  } else {
    log(`🤷 ${bot.name} 放弃购买 ${cell.city}（现金不足 ¥${cell.price.toLocaleString()}，余额 ¥${bot.gold.toLocaleString()}）`);
  }
  endTurnCheckDouble();
}

function saveGame() {
  const data = {
    players: players.map(p => ({...p})),
    cells: cells.map(c => ({...c, owner: c.owner})),
    currentPlayerIdx,
    phase,
    doubleCount,
    gameState: {...gameState},
    savedAt: Date.now()
  };
  localStorage.setItem('monopoly_save', JSON.stringify(data));
}

function loadGame() {
  const saved = localStorage.getItem('monopoly_save');
  if(!saved) return false;
  try {
    const data = JSON.parse(saved);
    // Restore basic state
    players = data.players;
    cells = data.cells;
    currentPlayerIdx = data.currentPlayerIdx;
    phase = data.phase;
    doubleCount = data.doubleCount;
    gameState = data.gameState;
    
    // Re-create DOM for cells (but keep loaded data)
    board.innerHTML = '';
    cells.forEach((cell, idx) => {
      const pos = getCellPos(idx);
      const div = document.createElement('div');
      div.className = 'cell side-cell';
      div.style.left = pos.x + 'px';
      div.style.top = pos.y + 'px';
      div.id = 'cell-' + idx;

      const numSpan = document.createElement('span');
      numSpan.className = 'cell-num';
      numSpan.textContent = idx+1;
      div.appendChild(numSpan);

      if(cell.type === 'land') {
        const citySpan = document.createElement('span');
        citySpan.className = 'city';
        citySpan.textContent = cell.city;
        div.appendChild(citySpan);

        const priceSpan = document.createElement('span');
        priceSpan.className = 'price';
        priceSpan.textContent = '¥' + cell.price;
        div.appendChild(priceSpan);
      } else {
        const citySpan = document.createElement('span');
        citySpan.className = 'city';
        citySpan.textContent = cell.city;
        div.appendChild(citySpan);
      }

      if(cell.color) {
        const bar = document.createElement('div');
        bar.className = 'color-bar';
        bar.style.background = cell.color;
        div.appendChild(bar);
      }

      div.onclick = () => onCellClick(idx);
      board.appendChild(div);
    });

    // Create tokens for loaded players
    const boardWrap = document.getElementById('board-wrap');
    players.forEach((p, i) => {
      const existing = document.getElementById('token-'+i);
      if(existing) existing.remove();
      const token = document.createElement('div');
      token.className = 'token ' + p.token;
      token.id = 'token-' + i;
      token.textContent = i === 0 ? '🎮' : (i===1?'🦅':i===2?'🐢':'🦊');
      boardWrap.appendChild(token);
    });

    updateTokenPositions();
    updateUI();
    log('📂 游戏已读取存档');
    return true;
  } catch(e) {
    console.error('Load failed:', e);
    return false;
  }
}

function resetGame() {
  document.getElementById('gameover').classList.remove('show');
  // Remove old tokens
  players.forEach((p,i) => {
    const t = document.getElementById('token-'+i);
    if(t) t.remove();
  });
  initCells();
  initPlayers();
  // Re-init card decks
  gameState = {
    chanceDeck: shuffleDeck([...chanceCards]),
    fateDeck: shuffleDeck([...fateCards]),
    globalRentHalved: 0,
    bonusColor: 0,
    cityBoost: 0,
    lastResearch: '',

  };
  currentPlayerIdx = 0;
  phase = 'start';
  doubleCount = 0;
  document.getElementById('log-panel').innerHTML = '';
  log('🎮 新游戏开始！');
  document.getElementById('start-modal').classList.add('show');

}

function updatePlayerCards() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'player-card' + (i === currentPlayerIdx && phase !== 'gameover' ? ' active' : '');
    const icons = ['', '🏠', '🏢', '🏙️'];
    const props = p.properties.slice(0,5).map(pi => {
      const c = cells[pi];
      return c.level > 0 ? c.city+icons[c.level] : c.city;
    }).join(', ');
    const extra = p.properties.length > 5 ? ` +${p.properties.length-5}块` : '';
    card.innerHTML = `
      <div class="pname">${p.id===0?'🎮':'🤖'} ${p.name}</div>
      <div class="pgold">¥${p.gold.toLocaleString()}</div>
      <div class="pstat">地皮: ${p.properties.length}块${props ? ' · '+props+extra : ''}</div>
      ${p.inJail ? '<div class="pstat" style="color:#f87171">⛓️ 监狱中</div>' : ''}
    `;
    panel.appendChild(card);
  });
}

function updateTokenPositions() {
  players.forEach((p, i) => {
    if(!p.alive) return;
    const token = document.getElementById('token-' + i);
    if(!token) return;
    const pos = getCellPos(p.position);
    const tokenSize = 22;
    const cellW = SIDE_CELL_W;
    const cellH = SIDE_CELL_H;
    // Offset by player index to avoid overlap
    const offsets = [
      {x: cellW/2 - tokenSize/2 - 12, y: cellH/2 - tokenSize/2},
      {x: cellW/2 - tokenSize/2 + 12, y: cellH/2 - tokenSize/2},
      {x: cellW/2 - tokenSize/2 - 12, y: cellH/2 - tokenSize/2 + 18},
      {x: cellW/2 - tokenSize/2 + 12, y: cellH/2 - tokenSize/2 + 18},
    ];
    const off = offsets[i] || offsets[0];
    const cellEl = document.getElementById('cell-' + p.position);
    let baseX = pos.x, baseY = pos.y;
    if(cellEl) {
      baseX = parseInt(cellEl.style.left) || pos.x;
      baseY = parseInt(cellEl.style.top) || pos.y;
    }
    token.style.left = (baseX + off.x) + 'px';
    token.style.top = (baseY + off.y) + 'px';
  });
}

function updateCellDot(cellIdx) {
  const cell = cells[cellIdx];
  const dot = document.getElementById('dot-' + cellIdx);
  if(!dot) return;
  if(cell.owner !== null) {
    const colors = ['#67e8f9','#ff6b6b','#ffe66d','#a78bfa'];
    dot.style.background = colors[cell.owner];
  } else {
    dot.style.background = '';
  }
  updateCellBuilding(cellIdx);
}

function updateCellBuilding(cellIdx) {
  const cell = cells[cellIdx];
  const el = document.getElementById('cell-' + cellIdx);
  if(!el) return;
  
  // Remove existing building indicator
  const existing = el.querySelector('.build-indicator');
  if(existing) existing.remove();
  
  if(cell.owner !== null && cell.level > 0) {
    const icons = ['', '🏠', '🏢', '🏙️'];
    const indicator = document.createElement('div');
    indicator.className = 'build-indicator';
    indicator.style.cssText = 'position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:0.7rem;pointer-events:none;text-shadow:0 0 4px rgba(0,0,0,0.8)';
    indicator.textContent = icons[cell.level] || '';
    el.appendChild(indicator);
  }
}

function onCellClick(idx) {
  const cell = cells[idx];
  const player = players[currentPlayerIdx];
  
  if(cell.type !== 'land' || cell.rank === null) {
    const typeLabels = {chance:'🎲机会',fate:'🃏命运',start:'起点',jail:'监狱',park:'免费停车',station:'火车站',airport:'机场'};
    log(`${cell.city} | ${typeLabels[cell.type] || '特殊格'}`);
    return;
  }
  
  if(cell.owner === player.id) {
    showBuildModal(cell, player);
    return;
  }
  
  log(`${cell.city} | 地皮`);
}

function showBuildModal(cell, player) {
  const levelNames = ['空地', '🏠 房屋', '🏢 楼房', '🏙️ 摩天楼'];
  const costs = RANK_BUILD;
  const buildCost = costs[cell.rank];
  const canBuild = hasColorSet(player, cell.rank);
  const currentLevel = cell.level;
  const currentRent = getRent(cell);
  
  let info = `<div style="text-align:center;margin-bottom:16px">
    <div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${cell.city}</div>
    <div style="color:${cell.color};font-size:0.8rem;margin-top:4px">${cell.rank}级地段</div>
    <div style="margin-top:8px;font-size:1.1rem">${levelNames[currentLevel]}</div>
    <div style="color:var(--dim);font-size:0.8rem;margin-top:4px">当前租金：¥${currentRent.toLocaleString()}</div>
  </div>`;
  
  if(currentLevel >= 3) {
    info += `<div style="text-align:center;color:var(--dim);font-size:0.85rem">已达最高等级（摩天楼）</div>`;
    document.getElementById('build-info').innerHTML = info;
    document.getElementById('build-btns').innerHTML = '<button class="btn" onclick="closeBuildModal()">关闭</button>';
  } else if(!canBuild) {
    const needed = cells.filter(c => c.rank === cell.rank && c.owner !== player.id);
    info += `<div style="text-align:center;color:#fbbf24;font-size:0.85rem">⚠️ 还需拥有该颜色全部地皮才能建造<br>（还差 ${needed.length} 块：${needed.map(c=>c.city).join('、')}）</div>`;
    document.getElementById('build-info').innerHTML = info;
    document.getElementById('build-btns').innerHTML = '<button class="btn" onclick="closeBuildModal()">关闭</button>';
  } else {
    const nextLevel = currentLevel + 1;
    const nextCost = buildCost;
    const nextRent = RANK_RENTS[cell.rank][nextLevel];
    const canAfford = player.gold >= nextCost;
    info += `<div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:12px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span>▶ ${levelNames[nextLevel]}</span>
        <span>租金：¥${nextRent.toLocaleString()}</span>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span>建造费用</span>
        <span style="color:${canAfford ? 'var(--accent)' : '#ff6b6b'}">¥${nextCost.toLocaleString()}</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px">
        <span>当前余额</span>
        <span>¥${player.gold.toLocaleString()}</span>
      </div>
    </div>`;
    document.getElementById('build-info').innerHTML = info;
    if(canAfford) {
      document.getElementById('build-btns').innerHTML = `<button class="btn" onclick="buildProperty(${cell.id})" style="margin-right:8px">建造 ${levelNames[nextLevel]}</button><button class="btn" onclick="closeBuildModal()" style="background:rgba(255,255,255,0.1)">取消</button>`;
    } else {
      document.getElementById('build-btns').innerHTML = `<button class="btn" disabled style="opacity:0.5">余额不足（需 ¥${nextCost.toLocaleString()}）</button><button class="btn" onclick="closeBuildModal()" style="background:rgba(255,255,255,0.1);margin-left:8px">关闭</button>`;
    }
  }
  
  document.getElementById('build-modal').classList.add('show');
}

function buildProperty(cellId) {
  const cell = cells.find(c => c.id === cellId);
  const player = players[currentPlayerIdx];
  const cost = RANK_BUILD[cell.rank];
  
  if(player.gold < cost || cell.level >= 3) return;
  
  player.gold -= cost;
  cell.level++;
  
  const levelNames = ['空地', '🏠 房屋', '🏢 楼房', '🏙️ 摩天楼'];
  log(`🏗️ ${player.name} 在 ${cell.city} 建造了 ${levelNames[cell.level]}（花费 ¥${cost.toLocaleString()}，余额 ¥${player.gold.toLocaleString()}）`);
  
  updateCellBuilding(cell.id);
  updatePlayerCards();
  closeBuildModal();
}

  document.getElementById('build-modal').classList.remove('show');
}

  const p = players[currentPlayerIdx];
  const info = document.getElementById('jail-info');

  info.innerHTML = `你在监狱！还剩 <strong>${p.jailTurns}</strong> 回合<br><br>
    选项1: 掷骰子尝试出狱（掷出双骰立刻释放）<br>
    选项2: 支付 <strong>¥500</strong> 立刻出狱`;
  btns.innerHTML = `
    <button class="btn" onclick="payJailFine()" style="margin-right:8px">💰 付 ¥500 出狱</button>
    <button class="btn secondary" onclick="rollJailDice()">🎲 掷骰子</button>
  `;
  document.getElementById('jail-modal').classList.add('show');
}

function payJailFine() {
  const p = players[currentPlayerIdx];
  p.gold -= 500;
  p.inJail = false;
  p.jailTurns = 0;
  log(`💰 ${p.name} 支付 ¥500 走出监狱！`);
  document.getElementById('jail-modal').classList.remove('show');
  updatePlayerCards();
  // Continue with normal turn
  phase = 'dice';
  updateTurnIndicator();
  diceBtn.disabled = false;
}

function rollJailDice() {
  document.getElementById('jail-modal').classList.remove('show');
  // Bot will handle the dice roll
  rollDice();
}

// ============================================================
// START
// ============================================================

function continueGame() {
  if(loadGame()) {
    document.getElementById('start-modal').classList.remove('show');
    phase = 'dice';
    diceBtn.disabled = false;
    updateTurnIndicator();
  }
}

function startGame() {
  // Init card decks on first start
  if (gameState.chanceDeck.length === 0) {
    gameState.chanceDeck = shuffleDeck([...chanceCards]);
    gameState.fateDeck = shuffleDeck([...fateCards]);
  }
  document.getElementById('start-modal').classList.remove('show');
  phase = 'dice';
  diceBtn.disabled = false;
  log('🎮 游戏开始，你的回合！');
  updateTurnIndicator();
}

// ============================================================
// BOOTSTRAP
// ============================================================

document.addEventListener('DOMContentLoaded', () => {
  initCells();
  initPlayers();
  
  // Check for saved game
  const hasSave = localStorage.getItem('monopoly_save');
  const btns = document.getElementById('start-btns');
  if(hasSave) {
    btns.innerHTML = `
      <button class="btn" onclick="startGame()" style="margin-right:8px">新游戏</button>
      <button class="btn secondary" onclick="continueGame()">📂 继续</button>
    `;
  }
  document.getElementById('start-modal').classList.add('show');
  updateUI();
  log('🎮 初始化完成，等待开始...');
  
  // Mobile: scale board to fit screen
  function resizeBoard() {
    const board = document.getElementById('board');
    const wrap = document.getElementById('board-wrap');
    const main = document.getElementById('main');
    if(!board || !wrap) return;
    const boardW = 704;
    const boardH = 704;
    const availableW = window.innerWidth - 32; // padding
    const availableH = window.innerHeight - 200; // account for header + panel
    if(availableW < boardW || availableH < boardH) {
      const scaleX = availableW / boardW;
      const scaleY = availableH / boardH;
      const scale = Math.min(scaleX, scaleY, 1);
      board.style.transform = `scale(${scale})`;
      board.style.transformOrigin = 'top left';
      wrap.style.width = (boardW * scale) + 'px';
      wrap.style.height = (boardH * scale) + 'px';
      if(main) main.style.overflowX = 'auto';
    } else {
      board.style.transform = '';
      wrap.style.width = boardW + 'px';
      wrap.style.height = boardH + 'px';
      if(main) main.style.overflowX = '';
    }
  }
  resizeBoard();
  window.addEventListener('resize', resizeBoard);
  window.addEventListener('orientationchange', () => setTimeout(resizeBoard, 100));
});
</script>
</body>
</html>
