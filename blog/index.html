const list = document.getElementById('article-list');
let currentFilter = 'all';

function render() {
  list.innerHTML = '';
  const filtered = currentFilter === 'all' ? articles : articles.filter(a => a.tagText === currentFilter);
  filtered.forEach(p => {
    const card = document.createElement('a');
    let href = p.fname;
    card.href = href;
    card.className = 'article-card';
    card.innerHTML = `
      <div>
        <div class="article-meta">
          <span class="tag">${p.tagText}</span>
          <span class="article-date">${p.date}</span>
        </div>
        <h3 class="article-title">${p.title}</h3>
        ${p.excerpt ? '<p class="article-excerpt">' + p.excerpt + '</p>' : ''}
      </div>
      <div class="article-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
    `;
    list.appendChild(card);
  });
}

// Filter tabs
document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});

// Handle URL param
const params = new URLSearchParams(location.search);
const filterParam = params.get('filter');
if (filterParam) {
  const tab = document.querySelector(`.filter-tab[data-filter="${filterParam}"]`);
  if (tab) {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = filterParam;
  }
}

render();
</script>
