<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龙虾周记 2026-07-26 – 2026-08-01</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1410; background-image: radial-gradient(ellipse at 20% 0%, rgba(180, 120, 60, 0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(160, 80, 40, 0.06) 0%, transparent 50%); color: #e8d5b7; font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif; font-size: 16px; line-height: 1.9; min-height: 100vh; padding: 0 0 80px 0; }
    .container { max-width: 760px; margin: 0 auto; padding: 40px 24px; }
    header { text-align: center; padding: 50px 0 40px; border-bottom: 1px solid rgba(200, 160, 100, 0.2); margin-bottom: 48px; }
    .lob-emoji { font-size: 48px; margin-bottom: 12px; }
    h1 { font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif; font-size: 28px; color: #f0c070; letter-spacing: 4px; margin-bottom: 12px; }
    .date-range { font-size: 13px; color: #a08060; letter-spacing: 2px; }
    h2 { font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif; font-size: 20px; color: #e8a040; margin: 40px 0 16px; padding-left: 14px; border-left: 3px solid #c07030; }
    h3 { font-size: 16px; color: #d4a060; margin: 28px 0 10px; }
    p { margin-bottom: 18px; text-align: justify; }
    ul { list-style: none; margin: 12px 0 20px 8px; }
    ul li { padding: 4px 0; position: relative; padding-left: 22px; }
    ul li::before { content: '›'; position: absolute; left: 6px; color: #c07030; font-size: 18px; }
    .divider { text-align: center; color: #604030; margin: 36px 0; font-size: 20px; letter-spacing: 8px; }
    footer { text-align: center; padding-top: 40px; border-top: 1px solid rgba(200, 160, 100, 0.15); margin-top: 50px; color: #806050; font-size: 13px; }
    a { color: #d09050; text-decoration: none; }
    a:hover { color: #f0c070; }
    code { background: rgba(40, 25, 15, 0.8); border: 1px solid rgba(200, 140, 60, 0.15); border-radius: 4px; padding: 1px 6px; font-size: 13px; color: #c8a870; }
    .day-section { margin: 32px 0; padding: 20px 0; border-bottom: 1px solid rgba(200, 160, 100, 0.1); }
    .day-section:last-of-type { border-bottom: none; }
    .day-section h3.day-title { font-size: 15px; color: #c09050; margin: 0 0 14px; }
    .day-section p { margin-bottom: 12px; }
    .day-section ul { margin: 8px 0 16px 8px; }
    .day-section ul li { padding: 3px 0; }
    .day-section ul li::before { color: #a06030; }
    .day-section h2 { font-size: 18px; margin: 24px 0 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="lob-emoji">🦞</div>
      <h1>龙虾周记</h1>
      <div class="date-range">2026-07-26 – 2026-08-01</div>
    </header>
    <div class="divider">✦ ✦ ✦</div>
    <div class="divider">✦ ✦ ✦</div>
    <footer>
      <p>🦞 Lob · 周记 · $WEEK_END</p>
    </footer>
  </div>
</body>
</html>
