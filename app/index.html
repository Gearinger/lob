<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>工具 — Lob</title>
<link rel="stylesheet" href="../colors.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-deep);color:var(--text-primary);font-family:-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:rgba(103,232,249,0.25);color:var(--text-primary)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}

header{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);background:rgba(10,10,10,0.8);border-bottom:1px solid var(--border)}
.header-inner{max-width:720px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center}
.back-btn{background:none;border:none;color:var(--text-secondary);font-size:1.2rem;cursor:pointer;padding:6px 8px;border-radius:6px;transition:color .2s,background .2s}
.back-btn:hover{color:var(--accent-primary);background:rgba(103,232,249,0.1)}
.logo{font-size:0.88rem;font-weight:600;color:var(--text-primary);margin-left:8px;text-decoration:none}

main{max-width:800px;margin:0 auto;padding:80px 24px 120px}

.hero{margin-bottom:48px}
.hero-eyebrow{font-size:0.72rem;color:var(--accent-primary);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px}
.hero-title{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:var(--text-primary);margin-bottom:10px}
.hero-desc{font-size:0.88rem;color:var(--text-secondary);line-height:1.7}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px 20px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:rgba(103,232,249,0.4);transform:translateY(-3px);box-shadow:0 8px 24px rgba(103,232,249,0.06)}
.card:active{transform:scale(0.98)}

.icon-wrap{width:48px;height:48px;border-radius:10px;background:rgba(103,232,249,0.08);display:flex;align-items:center;justify-content:center;margin-bottom:4px;flex-shrink:0}
.icon-wrap svg{width:22px;height:22px;stroke:var(--accent-primary);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.label{font-size:0.95rem;font-weight:600;color:var(--text-primary);line-height:1.3}
.sub{font-size:0.78rem;color:var(--text-muted);line-height:1.5}

footer{text-align:center;padding:40px 24px;font-size:0.75rem;color:var(--text-muted);border-top:1px solid var(--border);max-width:800px;margin:0 auto}

@media(max-width:640px){
  main{padding:72px 16px 80px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card{padding:18px 14px}
  .icon-wrap{width:40px;height:40px}
  .icon-wrap svg{width:18px;height:18px}
}
</style>
</head>
<body>
<header><div class="header-inner"><button onclick="history.back()" class="back-btn">←</button><a href="../" class="logo">🦞</a></div></header>

<main>
<div class="hero">
  <div class="hero-eyebrow">实用工具</div>
  <h1 class="hero-title">各种有趣的小应用</h1>
  <p class="hero-desc">占卜、测试、娱乐……有用最好，没用也玩</p>
</div>

<div class="grid">
  <a href="fortune/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></div>
    <span class="label">今日运势</span>
    <span class="sub">每日抽签，知吉凶</span>
  </a>
  <a href="tarot/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></div>
    <span class="label">塔罗占卜</span>
    <span class="sub">抽三张，解读过去现在未来</span>
  </a>
  <a href="zodiac/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
    <span class="label">星座配对</span>
    <span class="sub">你和TA的星座契合度</span>
  </a>
  <a href="bazi/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 22c-4-3-8-6-8-11a8 8 0 0 1 16 0c0 5-4 8-8 11Z"/><circle cx="12" cy="11" r="3"/></svg></div>
    <span class="label">八字简批</span>
    <span class="sub">出生年月，析命运</span>
  </a>
  <a href="name/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></div>
    <span class="label">姓名打分</span>
    <span class="sub">姓名藏天机，五行见真章</span>
  </a>
  <a href="dice/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1"/><circle cx="16" cy="16" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="8" cy="16" r="1"/></svg></div>
    <span class="label">玄学骰子</span>
    <span class="sub">摇一摇，让命运来决定</span>
  </a>
  <a href="sbti/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <span class="label">SBTI</span>
    <span class="sub">离谱人格测试</span>
  </a>
  <a href="fortune-sticks/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3M9 7c.5-.5 1.5-1 3-1s2.5.5 3 1M6 12c.5-1 1.5-1.5 3-1.5s2.5.5 3 1.5"/></svg></div>
    <span class="label">灵签</span>
    <span class="sub">玄天上帝灵签，心诚则灵</span>
  </a>
  <a href="pixel/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4"/><circle cx="17" cy="10" r="1"/><circle cx="15" cy="14" r="1"/></svg></div>
    <span class="label">像素风</span>
    <span class="sub">PixelForge 像素风生成器</span>
  </a>
  <a href="canvas/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.14-.75-.38-1.04-.24-.3-.37-.67-.37-1.06 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.5-4.5-10-10-10z"/></svg></div>
    <span class="label">Canvas</span>
    <span class="sub">交互 Demo 与可视化</span>
  </a>
  <a href="music/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <span class="label">黑胶唱片</span>
    <span class="sub">MiniMax AI 音乐播放器</span>
  </a>
  <a href="movie-watchlist/" class="card">
    <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h4"/></svg></div>
    <span class="label">文艺片补片</span>
    <span class="sub">248部经典，导演系必看</span>
  </a>
</div>
</main>

<footer>🦞 Lob · Made with curiosity</footer>
</body>
</html>
